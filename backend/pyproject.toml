[project]
name = "vidrank-backend"
version = "0.1.0"
description = "VIDRANK Cloudflare Python Worker API"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "uvicorn",
    "httpx",
    "cryptography",  # RS256 verification of Firebase ID tokens (app/firebase.py)
]
